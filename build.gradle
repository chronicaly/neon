plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = 'me.xchro.neon'
base { archivesName = 'neon' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly 'com.terraformersmc:modmenu:20.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.named('jar') { from('LICENSE'); from('NOTICE') }
tasks.named('sourcesJar') { from('LICENSE'); from('NOTICE') }
tasks.register('installNeon') {
    dependsOn tasks.named('assemble'), tasks.named('check')
    onlyIf { !providers.gradleProperty('skipInstall').isPresent() }
    doLast {
        def source = tasks.named('jar').get().archiveFile.get().asFile.toPath()
        project.ext.requireVerifiedNeon(source)
        def destination = file(providers.gradleProperty('neonInstallDir').getOrElse(
            'C:/Users/Martin Krisch/AppData/Roaming/PrismLauncher/instances/Vanilla/minecraft/mods')).toPath()
        java.nio.file.Files.createDirectories(destination)
        // Stable installed name prevents duplicate versions; metadata retains the release version.
        def target = destination.resolve('neon.jar')
        if (java.nio.file.Files.exists(target) && java.nio.file.Files.mismatch(source, target) == -1L) {
            logger.lifecycle("Verified Neon JAR already installed: ${target}")
            return
        }
        // Replace the directory entry, never truncate a JAR an existing client may still have open.
        def staged = java.nio.file.Files.createTempFile(destination, 'neon-', '.installing')
        try {
            java.nio.file.Files.copy(source, staged, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            if (java.nio.file.Files.mismatch(source, staged) != -1L) throw new GradleException('Staged JAR differs from checked build output')
            project.ext.requireVerifiedNeon(staged)
            for (int attempt = 0; ; attempt++) {
                try {
                    try { java.nio.file.Files.move(staged, target, java.nio.file.StandardCopyOption.ATOMIC_MOVE, java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
                    catch (java.nio.file.AtomicMoveNotSupportedException ignored) { java.nio.file.Files.move(staged, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
                    break
                } catch (java.nio.file.AccessDeniedException busy) {
                    if (attempt == 3) throw busy
                    Thread.sleep(100L << attempt)
                }
            }
        } finally { java.nio.file.Files.deleteIfExists(staged) }
        if (java.nio.file.Files.mismatch(source, target) != -1L) throw new GradleException('Installed JAR differs from build output')
        logger.lifecycle("Installed verified Neon JAR: ${target}")
    }
}
tasks.named('build') { dependsOn tasks.named('installNeon') }

// Test-only client entrypoint and mixins never enter the distributed JAR.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
}
loom {
    mods {
        neon { sourceSet sourceSets.main }
        neonsmoke { sourceSet sourceSets.smoke }
    }
    runs {
        smoke {
            client()
            name = 'Neon verification'
            source sourceSets.smoke
            runDir = 'runtime/smoke/game'
            vmArgs '-Dneon.smoke=true'
            programArgs '--quickPlaySingleplayer', 'Neon Verification'
        }
    }
}
tasks.named('check') { dependsOn tasks.named('smokeClasses') }
tasks.register('smokeJar', Jar) {
    dependsOn tasks.named('smokeClasses')
    archiveFileName = 'neon-verification-only.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    from sourceSets.smoke.output
}
def smokeArtifacts = file(providers.gradleProperty('smokeArtifactDir').getOrElse('build/smoke/production'))
tasks.register('prepareProdSmoke') {
    dependsOn tasks.named('jar'), tasks.named('smokeJar')
    doLast {
        def directory = smokeArtifacts.toPath()
        java.nio.file.Files.createDirectories(directory)
        def source = providers.gradleProperty('perfBaselineJar').isPresent() ? file(providers.gradleProperty('perfBaselineJar').get()).toPath() : providers.gradleProperty('perfBaseline').isPresent() ? file('runtime/neon-quality-baseline.jar').toPath() : tasks.named('jar').get().archiveFile.get().asFile.toPath()
        java.nio.file.Files.copy(source, directory.resolve('neon-under-test.jar'), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        java.nio.file.Files.copy(tasks.named('smokeJar').get().archiveFile.get().asFile.toPath(), directory.resolve('verification.jar'), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
tasks.register('prodSmoke', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    def verificationDirectory = file(providers.gradleProperty('smokeDir').getOrElse('runtime/smoke/game'))
    dependsOn tasks.named('prepareProdSmoke')
    mods.setFrom(new File(smokeArtifacts, 'neon-under-test.jar'), new File(smokeArtifacts, 'verification.jar'))
    mods.from configurations.runtimeClasspath.filter { it.name == "fabric-api-${fabric_api_version}.jar" }
    runDir = verificationDirectory
    jvmArgs.add('-Dneon.smoke=true')
    jvmArgs.add('-Xmx1536M')
    if (providers.gradleProperty('motionOnly').isPresent()) jvmArgs.add('-Dneon.smoke.motionOnly=true')
    if (providers.gradleProperty('clickerOnly').isPresent()) jvmArgs.add('-Dneon.smoke.clickerOnly=true')
    if (providers.gradleProperty('designOnly').isPresent()) jvmArgs.add('-Dneon.smoke.designOnly=true')
    if (providers.gradleProperty('menuOnly').isPresent()) jvmArgs.add('-Dneon.smoke.menuOnly=true')
    if (providers.gradleProperty('rowsOnly').isPresent()) jvmArgs.add('-Dneon.smoke.rowsOnly=true')
    if (providers.gradleProperty('colorOnly').isPresent()) jvmArgs.add('-Dneon.smoke.colorOnly=true')
    if (providers.gradleProperty('colorFocused').isPresent()) jvmArgs.add('-Dneon.smoke.colorFocused=true')
    if (providers.gradleProperty('recoveryOnly').isPresent()) jvmArgs.add('-Dneon.smoke.recoveryOnly=true')
    if (providers.gradleProperty('recoveryRestart').isPresent()) jvmArgs.add('-Dneon.smoke.recoveryRestart=true')
    if (providers.gradleProperty('desktopOnly').isPresent()) jvmArgs.add('-Dneon.smoke.desktopOnly=true')
    if (providers.gradleProperty('desktopPrimary').isPresent()) jvmArgs.add('-Dneon.desktop.primary=' + providers.gradleProperty('desktopPrimary').get())
    if (providers.gradleProperty('desktopAlternate').isPresent()) jvmArgs.add('-Dneon.desktop.alternate=' + providers.gradleProperty('desktopAlternate').get())
    if (providers.gradleProperty('stabilityOnly').isPresent()) jvmArgs.add('-Dneon.smoke.stabilityOnly=true')
    if (providers.gradleProperty('gridOnly').isPresent()) jvmArgs.add('-Dneon.smoke.gridOnly=true')
    if (providers.gradleProperty('hoverOnly').isPresent()) jvmArgs.add('-Dneon.smoke.hoverOnly=true')
    if (providers.gradleProperty('premiumOnly').isPresent()) jvmArgs.add('-Dneon.smoke.premiumOnly=true')
    if (providers.gradleProperty('hudOnly').isPresent()) jvmArgs.add('-Dneon.smoke.hudOnly=true')
    if (providers.gradleProperty('fpsOnly').isPresent()) jvmArgs.add('-Dneon.smoke.fpsOnly=true')
    if (providers.gradleProperty('fpsFocused').isPresent()) jvmArgs.add('-Dneon.smoke.fpsFocused=true')
    if (providers.gradleProperty('totemPopsOnly').isPresent()) jvmArgs.add('-Dneon.smoke.totemPopsOnly=true')
    if (providers.gradleProperty('nxeOnly').isPresent()) jvmArgs.add('-Dneon.smoke.nxeOnly=true')
    if (providers.gradleProperty('chatOnly').isPresent()) jvmArgs.add('-Dneon.smoke.chatOnly=true')
    if (providers.gradleProperty('screenshotOnly').isPresent()) jvmArgs.add('-Dneon.smoke.screenshotOnly=true')
    if (providers.gradleProperty('hudAll').isPresent()) jvmArgs.add('-Dneon.smoke.hudAll=true')
    if (providers.gradleProperty('numericOnly').isPresent()) jvmArgs.add('-Dneon.smoke.numericOnly=true')
    if (providers.gradleProperty('freelookOnly').isPresent()) jvmArgs.add('-Dneon.smoke.freelookOnly=true')
    if (providers.gradleProperty('interactionOnly').isPresent()) jvmArgs.add('-Dneon.smoke.interactionOnly=true')
    if (providers.gradleProperty('slidersOnly').isPresent()) jvmArgs.add('-Dneon.smoke.slidersOnly=true')
    if (providers.gradleProperty('perfOnly').isPresent()) {
        jvmArgs.add('-Dneon.smoke.perfOnly=true')
        jvmArgs.add('-Dneon.perf.label=' + providers.gradleProperty('perfLabel').getOrElse('after'))
        if (providers.gradleProperty('perfScenario').isPresent()) jvmArgs.add('-Dneon.perf.scenario=' + providers.gradleProperty('perfScenario').get())
        if (providers.gradleProperty('perfBaseline').isPresent()) jvmArgs.add('-Dneon.perf.baseline=true')
        if (providers.gradleProperty('perfExpectedHash').isPresent()) jvmArgs.add('-Dneon.perf.expectedHash=' + providers.gradleProperty('perfExpectedHash').get())
    }
    programArgs.addAll('--quickPlaySingleplayer', 'Neon Verification')
    doFirst { new File(verificationDirectory, 'neon-verification.txt').delete(); logger.lifecycle("Verification mods: ${mods.files}") }
    doLast {
        def result = new File(verificationDirectory, 'neon-verification.txt')
        if (!result.exists() || !result.text.startsWith('PASS ')) throw new GradleException('Live verification did not pass; inspect runtime/smoke/game/logs/latest.log')
        logger.lifecycle(result.text.trim())
    }
}

ext.neonProductionRunTaskType = net.fabricmc.loom.task.prod.ClientProductionRunTask
apply from: 'gradle/verified-install.gradle'
